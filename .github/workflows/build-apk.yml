name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract Android project
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_DIR=$(find extracted -type f -name "settings.gradle.kts" -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found inside ZIP"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Fix MainActivity.java
        shell: bash
        run: |
          JAVA_FILE="$PROJECT_DIR/app/src/main/java/com/solarpump/simulator/MainActivity.java"

          if [ ! -f "$JAVA_FILE" ]; then
            echo "ERROR: MainActivity.java not found"
            exit 1
          fi

          echo "Before fix:"
          head -n 5 "$JAVA_FILE"

          # حذف السطر الأول إذا كان يحتوي فقط على \
          sed -i '1{/^[[:space:]]*\\[[:space:]]*$/d;}' "$JAVA_FILE"

          echo "After fix:"
          head -n 5 "$JAVA_FILE"

          if ! grep -q "package com.solarpump.simulator;" "$JAVA_FILE"; then
            echo "ERROR: Java source is still invalid"
            exit 1
          fi

      - name: Setup Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Show environment
        shell: bash
        run: |
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "PROJECT_DIR=$PROJECT_DIR"

      - name: Build APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Find APK
        shell: bash
        run: |
          APK_FILE="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_FILE" ]; then
            echo "ERROR: APK was not created"
            find "$PROJECT_DIR/app/build/outputs" -type f || true
            exit 1
          fi

          cp "$APK_FILE" "$GITHUB_WORKSPACE/SolarPumpInverterSimulator.apk"
          ls -lh "$GITHUB_WORKSPACE/SolarPumpInverterSimulator.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: SolarPumpInverterSimulator-APK
          path: SolarPumpInverterSimulator.apk
          if-no-files-found: error
